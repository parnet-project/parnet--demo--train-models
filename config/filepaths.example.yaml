# config/filepaths.yaml
#
# Relative paths are resolved from the project root (directory containing pixi.toml).

# ── Files available locally (copied into resources/) ────────────────────────────

models:
  # Pretrained RBPNet weights — copied from NAS
  parnet.7m-0.0:   resources/models/parnet.7m-0.0.pt    # 29 MB, 2025-01-10_7M_penalized
  parnet.21m-0.0:  resources/models/parnet.21m-0.0.pt   # 84 MB, standard 21M model (penalty=0)

metadata:
  # RBP x cell-type experiment table (parnet ENCODE eCLIP, 223 experiments)
  full_rbp_set: resources/metadata/full_rbp_set.tsv
  # RBP functional annotations (Yeo-lab, Jun 2025)
  rbp_functions: resources/metadata/yeo_RBP_annotation.function.csv
  # Chromosome-level train / val / test split definitions
  train_val_test_splits: config/config.train_validation_test_split.yaml

parnet_encore_eclip:
  # Stripped .pt — canonical local source (native-length seqs, pad_side in meta).
  # Use this as starting point for new work.
  data_600nt_stripped_pt:    resources/parnet-encore-eclip/600nt_windows.no-one-hot.stripped/encode.filtered.pt
  # Prepadded variants — sequences at fixed 600 nt with edge N's for short tiles.
  data_600nt_prepadded_pt:   resources/parnet-encore-eclip/600nt_windows.no-one-hot.prepadded/encode.filtered.pt
  data_600nt_prepadded_hfds: resources/parnet-encore-eclip/600nt_windows.no-one-hot.prepadded/encode.filtered.hfds
  # 2000 nt dataset (deprecated — requires PARAMS_CROP=True to use with 600 nt model)
  data_2000nt: resources/parnet-encore-eclip/2000nt_windows/gencode.v48.annotation.transcripts.merged.tiles.data.filtered.splits.pt.gz

results:
  # Filtered stripped .pt dataset generated by prepare_datasets.py.ipynb
  filtered_dataset_spliceosome_hepg2: results/spliceosome-hepg2/datasets/dataset.pt
  # Filtered HFDS (produced by running scripts/convert_pt_to_hfds.py on the above)
  filtered_dataset_spliceosome_hepg2_hfds: results/spliceosome-hepg2/datasets/dataset.hfds
  # Full-set 600 nt dataset filtered for total CLIP signal — NAS mount required
  filtered_dataset_full_set_total_clip: /mnt/storage-nas-fast-2/research/projects/hzm/parnet-analyses/20260602_ml4rg26_deconvgclip_data/eclip_600bp_signalfiltered.pt.gz
